[project]
name = "forge-motion-server"
version = "2.0.0"
description = "Dora MoveJoints and MovePose action server for Forge robotics dataflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "forge-tool[dora]>=2.0.0,<3",
    "dora-rs>=1.0.1,<2",
    "forge-kinematics>=2.0.0,<3",
    "forge-msgs>=2.1.0,<3",
    "numpy>=2.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scipy>=1.14,<2",
]

[project.scripts]
forge-motion-server = "forge_motion_server.main:main"
forge-motion-action-policy = "forge_motion_server.policy_main:action_main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
