[project]
name = "forge-motion-server"
version = "0.1.0"
description = "Dora MoveJoints and MovePose action server for Forge robotics dataflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "dora-rs==0.4.1",
    "forge-kinematics",
    "forge-msgs",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
forge-motion-server = "forge_motion_server.main:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
