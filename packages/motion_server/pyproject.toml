[project]
name = "forge-motion-server"
version = "0.1.0"
description = "Dora MoveJoints and MovePose action server for Forge robotics dataflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "dora-rs==0.4.1",
    "forge-kinematics==1.0.1",
    "forge-msgs==1.0.1",
    "numpy>=2.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
]

[project.scripts]
forge-motion-server = "forge_motion_server.main:main"
forge-motion-action-policy = "forge_motion_server.policy_main:action_main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
