[project]
name = "forge-motion"
version = "0.1.0"
description = "Motion planning and execution orchestration for Forge robotics dataflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "forge-motion-server",
]

[dependency-groups]
build = [
    "pyinstaller>=6.18.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.uv.workspace]
members = [
    "packages/motion_server",
]

[tool.uv.sources]
forge-motion-server = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/forge_tool"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The package init prepends the vendored forge_tool source path before imports.
"packages/motion_server/src/forge_motion_server/__init__.py" = ["E402"]
